name: Run VFS Outpost E2E
description: Serve snapshot mounts through NFS-Ganesha and Samba outposts and read them through kernel clients

inputs:
  timeout-seconds:
    required: false
    default: "600"
    description: Timeout for the e2e test script

runs:
  using: composite
  steps:
    - name: Copy e2e script into container
      shell: bash
      run: |
        docker cp .github/actions/run-vfs-outpost-e2e/run.sh pbs-plus-test:/tmp/e2e-vfs-outpost.sh
        docker exec pbs-plus-test chmod +x /tmp/e2e-vfs-outpost.sh

    - name: Run VFS outpost e2e tests
      shell: bash
      run: |
        echo "Running VFS outpost e2e tests..."
        timeout ${{ inputs.timeout-seconds }} docker exec pbs-plus-test /tmp/e2e-vfs-outpost.sh
