name: Run LDAP Backup Tests
description: Verify real OpenLDAP LDIF backup and restore reach PBS task logs

inputs:
  timeout-seconds:
    required: false
    default: "300"
    description: Timeout for each LDAP job

runs:
  using: composite
  steps:
    - name: Run LDAP backups
      shell: bash
      run: |
        set -euo pipefail

        password='e2e-ldap-password'
        timeout='${{ inputs.timeout-seconds }}'
        base_dn='dc=example,dc=com'
        bind_dn="cn=admin,$base_dn"
        tls_root=$(mktemp -d)

        openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 \
          -subj '/CN=PBS Plus E2E LDAP CA' \
          -keyout "$tls_root/ca.key" -out "$tls_root/ca.crt" >/dev/null 2>&1
        create_server_cert() {
          local server=$1 dir="$tls_root/$1"
          mkdir -p "$dir"
          openssl req -newkey rsa:2048 -sha256 -nodes \
            -subj "/CN=$server" -addext "subjectAltName=DNS:$server" \
            -keyout "$dir/ldap.key" -out "$dir/ldap.csr" >/dev/null 2>&1
          printf 'subjectAltName=DNS:%s\nextendedKeyUsage=serverAuth\n' "$server" >"$dir/ext.cnf"
          openssl x509 -req -sha256 -days 1 -in "$dir/ldap.csr" \
            -CA "$tls_root/ca.crt" -CAkey "$tls_root/ca.key" -CAcreateserial \
            -extfile "$dir/ext.cnf" -out "$dir/ldap.crt" >/dev/null 2>&1
          cp "$tls_root/ca.crt" "$dir/ca.crt"
        }
        create_server_cert pbs-plus-ldap
        create_server_cert pbs-plus-ldap-restore

        create_ldap_server() {
          local server=$1
          docker create --name "$server" \
            --hostname "$server" \
            --network pbs-plus-test \
            -e LDAP_ORGANISATION="PBS Plus E2E" \
            -e LDAP_DOMAIN=example.com \
            -e LDAP_ADMIN_PASSWORD="$password" \
            -e LDAP_TLS=true \
            -e LDAP_TLS_CRT_FILENAME=ldap.crt \
            -e LDAP_TLS_KEY_FILENAME=ldap.key \
            -e LDAP_TLS_CA_CRT_FILENAME=ca.crt \
            osixia/openldap:1.5.0
          docker cp "$tls_root/$server/." "$server:/container/service/slapd/assets/certs/"
          docker start "$server"
          docker cp "$tls_root/ca.crt" "pbs-plus-test:/tmp/$server-ca.crt"
        }
        create_ldap_server pbs-plus-ldap
        create_ldap_server pbs-plus-ldap-restore

        ldap_ready() {
          docker logs "$1" 2>&1 | grep -q 'slapd starting' || return 1
          docker exec -e "LDAPTLS_CACERT=/tmp/$1-ca.crt" pbs-plus-test \
            ldapwhoami -x -ZZ -H "ldap://$1" \
            -D "$bind_dn" -w "$password" >/dev/null 2>&1
        }

        for server in pbs-plus-ldap pbs-plus-ldap-restore; do
          deadline=$((SECONDS + timeout))
          until ldap_ready "$server"; do
            if ((SECONDS >= deadline)); then
              echo "$server did not become ready"
              docker logs "$server" 2>&1 | tail -50
              exit 1
            fi
            sleep 2
          done
        done

        docker exec -i pbs-plus-ldap ldapadd -x -H ldap://localhost \
          -D "$bind_dn" -w "$password" <<LDIF
        dn: ou=people,$base_dn
        objectClass: organizationalUnit
        ou: people

        dn: uid=e2e-user,ou=people,$base_dn
        objectClass: inetOrgPerson
        uid: e2e-user
        cn: E2E User
        sn: User
        mail: e2e-user@example.com
        description: Directory backup
         continuation
        jpegPhoto:: AAECAwQFBgcICQ==
        userPassword: e2e-user-password

        dn: cn=e2e-group,ou=people,$base_dn
        objectClass: groupOfNames
        cn: e2e-group
        member: uid=e2e-user,ou=people,$base_dn
        LDIF

        api_post() {
          local path=$1
          shift
          docker exec pbs-plus-test curl -k -fsS -X POST "https://localhost:8017$path" \
            -H 'Content-Type: application/x-www-form-urlencoded' "$@"
        }

        create_target() {
          local response
          response=$(api_post '/api2/extjs/config/d2d-target' "$@")
          jq -e '.success == true' <<<"$response" >/dev/null || {
            echo "Target creation failed: $response"
            return 1
          }
        }

        create_target \
          --data-urlencode 'name=e2e-ldap' \
          --data-urlencode 'target_type=ldap' \
          --data-urlencode 'database_host=pbs-plus-ldap' \
          --data-urlencode 'database_port=389' \
          --data-urlencode "database_username=$bind_dn" \
          --data-urlencode "database_password=$password" \
          --data-urlencode 'database_tls_mode=starttls' \
          --data-urlencode 'database_ca_certificate=/tmp/pbs-plus-ldap-ca.crt' \
          --data-urlencode "ldap_base_dn=$base_dn"

        create_target \
          --data-urlencode 'name=e2e-ldap-restore' \
          --data-urlencode 'target_type=ldap' \
          --data-urlencode 'database_host=pbs-plus-ldap-restore' \
          --data-urlencode 'database_port=389' \
          --data-urlencode "database_username=$bind_dn" \
          --data-urlencode "database_password=$password" \
          --data-urlencode 'database_tls_mode=starttls' \
          --data-urlencode 'database_ca_certificate=/tmp/pbs-plus-ldap-restore-ca.crt' \
          --data-urlencode "ldap_base_dn=$base_dn"

        create_backup() {
          local response
          response=$(api_post '/api2/extjs/config/disk-backup' "$@")
          jq -e '.success == true' <<<"$response" >/dev/null || {
            echo "Backup creation failed: $response"
            return 1
          }
        }

        backup_form_defaults=(
          --data-urlencode 'store=test'
          --data-urlencode 'ns=ldap-e2e'
          --data-urlencode 'schedule='
          --data-urlencode 'retry='
          --data-urlencode 'retry-interval='
          --data-urlencode 'max-dir-entries='
          --data-urlencode 'mode='
          --data-urlencode 'sourcemode='
          --data-urlencode 'readmode='
          --data-urlencode 'include-xattr='
          --data-urlencode 'comment='
          --data-urlencode 'rawexclusions='
          --data-urlencode 'pre_script='
          --data-urlencode 'post_script='
        )

        create_backup \
          --data-urlencode 'id=e2e-ldap-backup' \
          --data-urlencode 'target=e2e-ldap' \
          "${backup_form_defaults[@]}"
        create_backup \
          --data-urlencode 'id=e2e-ldap-subtree-backup' \
          --data-urlencode 'target=e2e-ldap' \
          --data-urlencode 'database_scope=database' \
          --data-urlencode "database_name=ou=people,$base_dn" \
          "${backup_form_defaults[@]}"

        start_job() {
          local job_id=$1 encoded response
          encoded=$(printf '%s' "$job_id" | base64 -w0)
          echo "Starting $job_id..."
          response=$(api_post "/api2/extjs/d2d/backup?job=$encoded")
          jq -e '.success == true' <<<"$response" >/dev/null || {
            echo "Backup start failed: $response"
            return 1
          }
          echo "Backup API accepted $job_id"
        }

        wait_for_backup() {
          local job_id=$1 server_logs status_lines
          local deadline=$((SECONDS + timeout))
          while ((SECONDS < deadline)); do
            server_logs=$(docker logs pbs-plus-test 2>&1)

            status_lines=$(grep -F "\"jobID\":\"$job_id\"" <<<"$server_logs" | grep -F '"msg":"updating job status"' || true)
            if grep -qF '"succeeded":true' <<<"$status_lines"; then
              echo "Backup job $job_id succeeded"
              return 0
            fi

            if grep -qF '"succeeded":false' <<<"$status_lines"; then
              echo "Backup job $job_id failed"
              docker logs --tail=100 pbs-plus-test 2>&1
              return 1
            fi

            if grep -F "\"jobID\":\"$job_id\"" <<<"$server_logs" | grep -qF '"msg":"backup job failed"'; then
              echo "Backup job $job_id failed before the PBS client started"
              echo "--- probe: dns + bind from pbs-plus-test ---"
              docker exec pbs-plus-test getent hosts pbs-plus-ldap || true
              docker exec -e LDAPTLS_CACERT=/tmp/pbs-plus-ldap-ca.crt pbs-plus-test \
                ldapwhoami -x -ZZ -H ldap://pbs-plus-ldap:389 -D "$bind_dn" -w "$password" || true
              echo "--- probe: dump-shaped search from pbs-plus-test ---"
              docker exec pbs-plus-test sh -c "printf '%s' '$password' > /tmp/ldapprobe && chmod 600 /tmp/ldapprobe && LDAPTLS_CACERT=/tmp/pbs-plus-ldap-ca.crt ldapsearch -x -ZZ -H ldap://pbs-plus-ldap:389 -D '$bind_dn' -y /tmp/ldapprobe -LLL -o ldif-wrap=no -s sub -E pr=1000/noprompt -b '$base_dn' dn 2>&1 | head -10; rm -f /tmp/ldapprobe" || true
              echo "--- slapd connection log (pbs-plus-ldap) ---"
              docker logs --tail=60 pbs-plus-ldap 2>&1 | grep -vE '^\*\*\*' | tail -40 || true
              docker logs --tail=100 pbs-plus-test 2>&1
              return 1
            fi

            if (( SECONDS % 30 == 0 )); then
              echo "Waiting for $job_id... (${SECONDS}s elapsed)"
            fi

            sleep 5
          done

          echo "Backup job $job_id timed out after ${timeout}s"
          docker logs --tail=100 pbs-plus-test 2>&1
          return 1
        }

        start_job 'e2e-ldap-backup'
        wait_for_backup 'e2e-ldap-backup'
        start_job 'e2e-ldap-subtree-backup'
        wait_for_backup 'e2e-ldap-subtree-backup'

    - name: Verify LDAP backup task logs
      shell: bash
      run: |
        set -euo pipefail

        api_get() {
          docker exec pbs-plus-test curl -k -fsS "https://localhost:8017$1" -H 'Accept: application/json'
        }

        task_log() {
          docker exec -e UPID="$1" pbs-plus-test sh -ec \
            'pstart=$(printf "%s" "$UPID" | cut -d: -f4); bucket=$(printf "%02X" "$((0x$pstart & 255))"); cat "/var/log/proxmox-backup/tasks/$bucket/$UPID"'
        }

        verify_backup_task() {
          local job_id=$1 response item upid state endtime log marker section
          response=$(api_get '/api2/json/d2d/backup')
          item=$(jq -cer --arg job_id "$job_id" '.data[] | select(.id == $job_id)' <<<"$response")
          upid=$(jq -er '."last-run-upid"' <<<"$item")
          state=$(jq -er '."last-run-state"' <<<"$item")
          endtime=$(jq -er '."last-run-endtime"' <<<"$item")

          echo "Task history: $upid $state $endtime"

          if [[ "$state" != 'OK' ]]; then
            echo "Task failed: $state"
            exit 1
          fi
          if ! [[ "$endtime" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid task end time: $endtime"
            exit 1
          fi

          log=$(task_log "$upid")
          terminal=$(printf '%s\n' "$log" | tail -n 1)
          terminal_pattern='^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(Z|[+-][0-9]{2}:[0-9]{2}): TASK (OK|WARNINGS: [1-9][0-9]*)$'
          if ! [[ "$terminal" =~ $terminal_pattern ]]; then
            echo "Invalid PBS task-log terminal line: $terminal"
            printf '%s\n' "$log"
            exit 1
          fi

          marker="--- LDAP log starts here ---"
          if ! grep -Fqx -- "$marker" <<<"$log"; then
            echo "LDAP marker missing from task log"
            printf '%s\n' "$log"
            exit 1
          fi
          section=$(awk -v marker="$marker" '
            $0 == marker { capture = 1; next }
            capture && /pbs-plus: \[info\]: starting backup job/ { exit }
            capture { print }
          ' <<<"$log")
          if ! grep -q '[^[:space:]]' <<<"$section"; then
            echo "LDAP dump section is empty"
            printf '%s\n' "$log"
            exit 1
          fi
          if ! grep -Eq 'using LDAP client ' <<<"$section"; then
            echo "LDAP dump section is missing the client selection line"
            printf '%s\n' "$log"
            exit 1
          fi

          printf '%s dump section:\n%s\n' "LDAP" "$section"
        }

        verify_backup_task 'e2e-ldap-backup'
        verify_backup_task 'e2e-ldap-subtree-backup'

    - name: Run LDAP restore tests
      shell: bash
      run: |
        set -euo pipefail

        password='e2e-ldap-password'
        timeout='${{ inputs.timeout-seconds }}'
        base_dn='dc=example,dc=com'

        api_get() {
          docker exec pbs-plus-test curl -k -fsS "https://localhost:8017$1" -H 'Accept: application/json'
        }
        api_post() {
          local path=$1
          shift
          docker exec pbs-plus-test curl -k -fsS -X POST "https://localhost:8017$path" \
            -H 'Content-Type: application/x-www-form-urlencoded' "$@"
        }

        latest_snapshot() {
          local job_id=$1 snap_time snap_ts
          snap_time=$(docker exec -e JOB_ID="$job_id" pbs-plus-test sh -ec \
            'ls "/mnt/test/ns/ldap-e2e/host/$JOB_ID/" | grep -E "^[0-9]{4}-[0-9]{2}-[0-9]{2}T" | sort | tail -1')
          if [[ -z "$snap_time" ]]; then
            echo "No snapshot found for $job_id" >&2
            return 1
          fi
          snap_ts=$(docker exec -e SNAP_TIME="$snap_time" pbs-plus-test date -d "$snap_time" +%s)
          printf 'host/%s/%s' "$job_id" "$snap_ts"
        }

        create_restore() {
          local response
          response=$(api_post '/api2/extjs/config/disk-restore' "$@")
          jq -e '.success == true' <<<"$response" >/dev/null || {
            echo "Restore creation failed: $response"
            return 1
          }
        }

        start_restore() {
          local job_id=$1 encoded response
          encoded=$(printf '%s' "$job_id" | base64 -w0)
          echo "Starting $job_id..."
          response=$(api_post "/api2/extjs/d2d/restore?job=$encoded")
          jq -e '.success == true' <<<"$response" >/dev/null || {
            echo "Restore start failed: $response"
            return 1
          }
        }

        wait_for_restore() {
          local job_id=$1 encoded task_status
          encoded=$(printf '%s' "$job_id" | base64 -w0)
          local deadline=$((SECONDS + timeout))
          while ((SECONDS < deadline)); do
            task_status=$(api_get "/api2/extjs/config/disk-restore/$encoded" | jq -r '.data.history."last-run-state"')
            echo "  Task status: $task_status (${SECONDS}s elapsed)"
            if [[ "$task_status" == 'OK' ]]; then
              echo "Restore job $job_id succeeded"
              return 0
            fi
            if [[ "$task_status" == 'WARNINGS: '* ]]; then
              echo "Restore job $job_id completed with warnings: $task_status"
              return 0
            fi
            if [[ -n "$task_status" && "$task_status" != 'null' ]]; then
              echo "Restore job $job_id failed: $task_status"
              return 1
            fi
            sleep 5
          done
          echo "Restore job $job_id timed out after ${timeout}s"
          return 1
        }

        wait_for_restore_preflight_failure() {
          local job_id=$1 encoded task_status
          encoded=$(printf '%s' "$job_id" | base64 -w0)
          local deadline=$((SECONDS + timeout))
          while ((SECONDS < deadline)); do
            task_status=$(api_get "/api2/extjs/config/disk-restore/$encoded" | jq -r '.data.history."last-run-state"')
            if [[ "$task_status" == *'no entries under'* ]]; then
              echo "Restore job $job_id safely rejected the missing subtree"
              return 0
            fi
            if [[ -n "$task_status" && "$task_status" != 'null' ]]; then
              echo "Restore job $job_id had an unexpected result: $task_status"
              return 1
            fi
            sleep 5
          done
          echo "Restore job $job_id timed out after ${timeout}s"
          return 1
        }

        verify_ldap_entry() {
          local container=$1 result group
          result=$(docker exec -e LDAPTLS_CACERT=/container/service/slapd/assets/certs/ca.crt "$container" ldapsearch -LLL -x -ZZ -H "ldap://$container" \
            -D "cn=admin,$base_dn" -w "$password" \
            -b "ou=people,$base_dn" '(uid=e2e-user)' mail description jpegPhoto)
          grep -q 'e2e-user@example.com' <<<"$result" || {
            echo "e2e-user entry missing from $container"
            printf '%s\n' "$result"
            exit 1
          }
          grep -q 'Directory backupcontinuation' <<<"$result"
          grep -q 'AAECAwQFBgcICQ==' <<<"$result"
          group=$(docker exec -e LDAPTLS_CACERT=/container/service/slapd/assets/certs/ca.crt "$container" ldapsearch -LLL -x -ZZ -H "ldap://$container" \
            -D "cn=admin,$base_dn" -w "$password" \
            -b "cn=e2e-group,ou=people,$base_dn" -s base member)
          grep -q "member: uid=e2e-user,ou=people,$base_dn" <<<"$group"
          docker exec -e LDAPTLS_CACERT=/container/service/slapd/assets/certs/ca.crt "$container" ldapwhoami -x -ZZ -H "ldap://$container" \
            -D "uid=e2e-user,ou=people,$base_dn" -w e2e-user-password >/dev/null
          echo "$container has the restored LDAP entries, links, binary data, and password"
        }

        subtree_snapshot=$(latest_snapshot 'e2e-ldap-subtree-backup')
        create_restore \
          --data-urlencode 'id=e2e-ldap-restore' \
          --data-urlencode 'store=test' \
          --data-urlencode 'ns=ldap-e2e' \
          --data-urlencode "snapshot=$subtree_snapshot" \
          --data-urlencode 'src-path=/' \
          --data-urlencode 'dest-target=e2e-ldap-restore' \
          --data-urlencode 'dest-subpath=' \
          --data-urlencode 'mode=0' \
          --data-urlencode 'retry=0' \
          --data-urlencode 'retry-interval=1'
        start_restore 'e2e-ldap-restore'
        wait_for_restore 'e2e-ldap-restore'

        verify_ldap_entry pbs-plus-ldap-restore

        server_snapshot=$(latest_snapshot 'e2e-ldap-backup')
        create_restore \
          --data-urlencode 'id=e2e-ldap-restore-replace' \
          --data-urlencode 'store=test' \
          --data-urlencode 'ns=ldap-e2e' \
          --data-urlencode "snapshot=$server_snapshot" \
          --data-urlencode 'src-path=/' \
          --data-urlencode 'dest-target=e2e-ldap-restore' \
          --data-urlencode 'dest-subpath=' \
          --data-urlencode 'mode=0' \
          --data-urlencode 'retry=0' \
          --data-urlencode 'retry-interval=1' \
          --data-urlencode "source_database=ou=people,$base_dn" \
          --data-urlencode 'replace_existing=true'
        start_restore 'e2e-ldap-restore-replace'
        wait_for_restore 'e2e-ldap-restore-replace'

        verify_ldap_entry pbs-plus-ldap-restore

        create_restore \
          --data-urlencode 'id=e2e-ldap-restore-missing' \
          --data-urlencode 'store=test' \
          --data-urlencode 'ns=ldap-e2e' \
          --data-urlencode "snapshot=$server_snapshot" \
          --data-urlencode 'src-path=/' \
          --data-urlencode 'dest-target=e2e-ldap-restore' \
          --data-urlencode 'dest-subpath=' \
          --data-urlencode 'mode=0' \
          --data-urlencode 'retry=0' \
          --data-urlencode 'retry-interval=1' \
          --data-urlencode "source_database=ou=missing,$base_dn" \
          --data-urlencode 'replace_existing=true'
        start_restore 'e2e-ldap-restore-missing'
        wait_for_restore_preflight_failure 'e2e-ldap-restore-missing'

        verify_ldap_entry pbs-plus-ldap-restore
