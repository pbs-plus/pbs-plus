name: Run Dovecot Mailbox Backup Tests
description: Verify Dovecot mailbox backup and restore over TLS
inputs:
  timeout-seconds:
    required: false
    default: "700"
    description: Timeout for each Dovecot job; must exceed dovecot's hardcoded 600s dsync I/O stall watchdog so a stalled sync resolves into a diagnosable failure instead of an opaque timeout
runs:
  using: composite
  steps:
    - name: Run Dovecot mailbox backup tests
      shell: bash
      run: |
        set -euo pipefail

        timeout='${{ inputs.timeout-seconds }}'
        doveadm_password='e2e-doveadm-password'
        workdir=$(mktemp -d)
        trap 'rm -rf "$workdir" >/dev/null 2>&1 || true' EXIT

        create_server() {
          local name=$1 hostname=$2
          local dir="$workdir/$name"
          mkdir -p "$dir/certs" "$dir/private" "$dir/mail"
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$dir/private/server.key" \
            -out "$dir/certs/server.pem" \
            -days 1 -subj "/CN=$hostname" \
            -addext "subjectAltName=DNS:$hostname" >/dev/null 2>&1
          chmod 0600 "$dir/private/server.key"
          cat > "$dir/dovecot.conf" <<EOF
        dovecot_config_version = 2.4.0
        dovecot_storage_version = 2.4.0
        listen = *
        protocols =
        log_path = /dev/stderr
        info_log_path = /dev/stdout
        debug_log_path = /dev/stderr
        auth_verbose = yes
        auth_mechanisms = plain
        mail_driver = maildir
        mail_path = %{home}/Maildir
        mail_home = /srv/mail/%{user}
        mail_uid = 1000
        mail_gid = 1000
        passdb static {
          fields {
            nopassword = yes
          }
        }
        userdb static {
          allow_all_users = yes
          fields {
            uid = 1000
            gid = 1000
            home = /srv/mail/%{user}
          }
        }
        service doveadm {
          inet_listener doveadm {
            port = 24245
            ssl = yes
          }
        }
        doveadm_password = $doveadm_password
        ssl_server {
          cert_file = /etc/dovecot/certs/server.pem
          key_file = /etc/dovecot/private/server.key
        }
        EOF
          docker run -d --name "$name" --network pbs-plus-test \
            -v "$dir/dovecot.conf:/etc/dovecot/dovecot.conf:ro" \
            -v "$dir/certs:/etc/dovecot/certs:ro" \
            -v "$dir/private:/etc/dovecot/private:ro" \
            -v "$dir/mail:/srv/mail" \
            --entrypoint /usr/sbin/dovecot \
            pbs-plus:test -F -c /etc/dovecot/dovecot.conf >/dev/null
        }

        create_server pbs-plus-dovecot-source pbs-plus-dovecot-source
        create_server pbs-plus-dovecot-destination pbs-plus-dovecot-destination

        copy_ca() {
          local name=$1
          local container="pbs-plus-dovecot-$name"
          docker cp "$workdir/$container/certs/server.pem" "pbs-plus-test:/tmp/$name-ca.pem" >/dev/null
        }
        copy_ca source
        copy_ca destination

        wait_for_server() {
          local name=$1
          local deadline=$((SECONDS + timeout))
          while ((SECONDS < deadline)); do
            if docker exec pbs-plus-test sh -ec \
              "timeout 10 openssl s_client -brief -connect $name:24245 -servername $name -CAfile /tmp/${name#pbs-plus-dovecot-}-ca.pem -verify_hostname $name -verify_return_error </dev/null" \
              >/dev/null 2>&1; then
              echo "Dovecot server $name is ready"
              return 0
            fi
            sleep 2
          done
          echo "Dovecot server $name did not become ready"
          docker logs "$name" 2>&1
          return 1
        }
        wait_for_server pbs-plus-dovecot-source
        wait_for_server pbs-plus-dovecot-destination

        seed_mail() {
          local name=$1 user=$2 body=$3 filename=$4
          docker exec -e TEST_USER="$user" -e TEST_BODY="$body" -e TEST_FILE="$filename" "$name" sh -ec '
            mail_dir="/srv/mail/$TEST_USER/Maildir"
            mkdir -p "$mail_dir/cur" "$mail_dir/new" "$mail_dir/tmp"
            printf "From: %s\nSubject: e2e\nDate: Tue, 02 Sep 2026 12:00:00 +0000\nMessage-ID: <%s@e2e.test>\n\n%s\n" "$TEST_USER" "$TEST_FILE" "$TEST_BODY" > "$mail_dir/new/$TEST_FILE"
            chown -R 1000:1000 /srv/mail
          '
        }
        seed_mail pbs-plus-dovecot-source alice@example.com source-message alice-source-1
        seed_mail pbs-plus-dovecot-destination bob@example.com destination-message bob-dest-1
        echo "Seeded alice on the source and bob on the destination"

        api_post() {
          local path=$1
          shift
          docker exec pbs-plus-test curl -k -fsS -X POST "https://localhost:8017$path" \
            -H 'Content-Type: application/x-www-form-urlencoded' "$@"
        }

        create_target() {
          local response
          response=$(api_post '/api2/extjs/config/d2d-target' "$@")
          jq -e '.success == true' <<<"$response" >/dev/null || {
            echo "Target creation failed: $response"
            return 1
          }
        }

        create_target \
          --data-urlencode 'name=e2e-dovecot-source' \
          --data-urlencode 'target_type=dovecot' \
          --data-urlencode 'database_host=pbs-plus-dovecot-source' \
          --data-urlencode 'database_port=24245' \
          --data-urlencode "database_password=$doveadm_password" \
          --data-urlencode 'database_ca_certificate=/tmp/source-ca.pem' \
          --data-urlencode 'database_default_client_dir=/usr/bin'
        create_target \
          --data-urlencode 'name=e2e-dovecot-destination' \
          --data-urlencode 'target_type=dovecot' \
          --data-urlencode 'database_host=pbs-plus-dovecot-destination' \
          --data-urlencode 'database_port=24245' \
          --data-urlencode "database_password=$doveadm_password" \
          --data-urlencode 'database_ca_certificate=/tmp/destination-ca.pem' \
          --data-urlencode 'database_default_client_dir=/usr/bin'
        echo "Created Dovecot targets"

        response=$(api_post '/api2/extjs/config/disk-backup' \
          --data-urlencode 'id=e2e-dovecot-backup' \
          --data-urlencode 'target=e2e-dovecot-source' \
          --data-urlencode 'store=test' \
          --data-urlencode 'ns=dovecot-e2e' \
          --data-urlencode 'dovecot_username=alice@example.com' \
          --data-urlencode 'dovecot_mailbox=' \
          --data-urlencode 'schedule=' \
          --data-urlencode 'retry=' \
          --data-urlencode 'retry-interval=' \
          --data-urlencode 'max-dir-entries=' \
          --data-urlencode 'mode=' \
          --data-urlencode 'sourcemode=' \
          --data-urlencode 'readmode=' \
          --data-urlencode 'include-xattr=' \
          --data-urlencode 'comment=' \
          --data-urlencode 'rawexclusions=' \
          --data-urlencode 'pre_script=' \
          --data-urlencode 'post_script=')
        jq -e '.success == true' <<<"$response" >/dev/null

        start_job() {
          local job_id=$1 encoded response
          encoded=$(printf '%s' "$job_id" | base64 -w0)
          echo "Starting $job_id..."
          response=$(api_post "/api2/extjs/d2d/backup?job=$encoded")
          jq -e '.success == true' <<<"$response" >/dev/null || {
            echo "Backup start failed: $response"
            return 1
          }
          echo "Backup API accepted $job_id"
        }

        wait_for_backup() {
          local job_id=$1 server_logs status_lines
          local deadline=$((SECONDS + timeout))
          while ((SECONDS < deadline)); do
            server_logs=$(docker logs pbs-plus-test 2>&1)

            status_lines=$(grep -F "\"jobID\":\"$job_id\"" <<<"$server_logs" | grep -F '"msg":"updating job status"' || true)
            if grep -qF '"succeeded":true' <<<"$status_lines"; then
              echo "Backup job $job_id succeeded"
              return 0
            fi

            if grep -qF '"succeeded":false' <<<"$status_lines"; then
              echo "Backup job $job_id failed"
              docker logs --tail=100 pbs-plus-test 2>&1
              return 1
            fi

            if grep -F "\"jobID\":\"$job_id\"" <<<"$server_logs" | grep -qF '"msg":"backup job failed"'; then
              echo "Backup job $job_id failed before the PBS client started"
              echo "--- probe: dns + doveadm TLS from pbs-plus-test ---"
              docker exec pbs-plus-test getent hosts pbs-plus-dovecot-source || true
              docker exec pbs-plus-test sh -ec \
                'timeout 10 openssl s_client -brief -connect pbs-plus-dovecot-source:24245 -servername pbs-plus-dovecot-source -CAfile /tmp/source-ca.pem -verify_hostname pbs-plus-dovecot-source -verify_return_error </dev/null' || true
              echo "--- dovecot source container log ---"
              docker logs --tail=60 pbs-plus-dovecot-source 2>&1 | tail -40 || true
              docker logs --tail=100 pbs-plus-test 2>&1
              return 1
            fi

            if (( SECONDS % 30 == 0 )); then
              echo "Waiting for $job_id... (${SECONDS}s elapsed)"
            fi

            sleep 5
          done

          echo "Backup job $job_id timed out after ${timeout}s"
          echo "--- source container log ---"
          docker logs --tail=60 pbs-plus-dovecot-source 2>&1 | tail -40 || true
          docker logs --tail=100 pbs-plus-test 2>&1
          return 1
        }

        start_job 'e2e-dovecot-backup'
        wait_for_backup 'e2e-dovecot-backup'

    - name: Verify Dovecot backup task logs
      shell: bash
      run: |
        set -euo pipefail

        api_get() {
          docker exec pbs-plus-test curl -k -fsS "https://localhost:8017$1" -H 'Accept: application/json'
        }

        task_log() {
          docker exec -e UPID="$1" pbs-plus-test sh -ec \
            'pstart=$(printf "%s" "$UPID" | cut -d: -f4); bucket=$(printf "%02X" "$((0x$pstart & 255))"); cat "/var/log/proxmox-backup/tasks/$bucket/$UPID"'
        }

        verify_backup_task() {
          local job_id=$1 response item upid state endtime log terminal marker section
          response=$(api_get '/api2/json/d2d/backup')
          item=$(jq -cer --arg job_id "$job_id" '.data[] | select(.id == $job_id)' <<<"$response")
          upid=$(jq -er '."last-run-upid"' <<<"$item")
          state=$(jq -er '."last-run-state"' <<<"$item")
          endtime=$(jq -er '."last-run-endtime"' <<<"$item")

          echo "Task history: $upid $state $endtime"

          if [[ "$state" != 'OK' ]]; then
            echo "Task failed: $state"
            exit 1
          fi
          if ! [[ "$endtime" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid task end time: $endtime"
            exit 1
          fi

          log=$(task_log "$upid")
          terminal=$(printf '%s\n' "$log" | tail -n 1)
          terminal_pattern='^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(Z|[+-][0-9]{2}:[0-9]{2}): TASK (OK|WARNINGS: [1-9][0-9]*)$'
          if ! [[ "$terminal" =~ $terminal_pattern ]]; then
            echo "Invalid PBS task-log terminal line: $terminal"
            printf '%s\n' "$log"
            exit 1
          fi

          marker='--- Dovecot log starts here ---'
          if ! grep -Fqx -- "$marker" <<<"$log"; then
            echo "Dovecot marker missing from task log"
            printf '%s\n' "$log"
            exit 1
          fi
          section=$(awk -v marker="$marker" '
            $0 == marker { capture = 1; next }
            capture && /pbs-plus: \[info\]: starting backup job/ { exit }
            capture { print }
          ' <<<"$log")
          if ! grep -q 'using Dovecot client 2\.4' <<<"$section"; then
            echo "Dovecot section is missing the client selection line"
            printf '%s\n' "$log"
            exit 1
          fi

          printf 'Dovecot section:\n%s\n' "$section"
        }

        verify_backup_task 'e2e-dovecot-backup'

    - name: Run Dovecot restore tests
      shell: bash
      run: |
        set -euo pipefail

        timeout='${{ inputs.timeout-seconds }}'
        trap 'docker rm -f pbs-plus-dovecot-source pbs-plus-dovecot-destination >/dev/null 2>&1 || true' EXIT

        api_get() {
          docker exec pbs-plus-test curl -k -fsS "https://localhost:8017$1" -H 'Accept: application/json'
        }
        api_post() {
          local path=$1
          shift
          docker exec pbs-plus-test curl -k -fsS -X POST "https://localhost:8017$path" \
            -H 'Content-Type: application/x-www-form-urlencoded' "$@"
        }

        latest_snapshot() {
          local snap_time snap_ts
          snap_time=$(docker exec pbs-plus-test sh -ec \
            'ls /mnt/test/ns/dovecot-e2e/host/e2e-dovecot-backup/ | grep -E "^[0-9]{4}-[0-9]{2}-[0-9]{2}T" | sort | tail -1')
          if [[ -z "$snap_time" ]]; then
            echo "No snapshot found for e2e-dovecot-backup" >&2
            return 1
          fi
          snap_ts=$(docker exec -e SNAP_TIME="$snap_time" pbs-plus-test date -d "$snap_time" +%s)
          printf 'host/e2e-dovecot-backup/%s' "$snap_ts"
        }

        create_restore() {
          local response
          response=$(api_post '/api2/extjs/config/disk-restore' "$@")
          jq -e '.success == true' <<<"$response" >/dev/null || {
            echo "Restore creation failed: $response"
            return 1
          }
        }

        start_restore() {
          local job_id=$1 encoded response
          encoded=$(printf '%s' "$job_id" | base64 -w0)
          echo "Starting $job_id..."
          response=$(api_post "/api2/extjs/d2d/restore?job=$encoded")
          jq -e '.success == true' <<<"$response" >/dev/null || {
            echo "Restore start failed: $response"
            return 1
          }
        }

        wait_for_restore() {
          local job_id=$1 encoded task_status
          encoded=$(printf '%s' "$job_id" | base64 -w0)
          local deadline=$((SECONDS + timeout))
          while ((SECONDS < deadline)); do
            task_status=$(api_get "/api2/extjs/config/disk-restore/$encoded" | jq -r '.data.history."last-run-state"')
            echo "  Task status: $task_status (${SECONDS}s elapsed)"
            if [[ "$task_status" == 'OK' || "$task_status" == 'WARNINGS: '* ]]; then
              echo "Restore job $job_id succeeded"
              return 0
            fi
            if [[ -n "$task_status" && "$task_status" != 'null' ]]; then
              echo "Restore job $job_id failed: $task_status"
              echo "--- destination container log ---"
              docker logs --tail=60 pbs-plus-dovecot-destination 2>&1 | tail -40 || true
              docker logs --tail=100 pbs-plus-test 2>&1
              return 1
            fi
            sleep 5
          done
          echo "Restore job $job_id timed out after ${timeout}s"
          echo "--- destination container log ---"
          docker logs --tail=60 pbs-plus-dovecot-destination 2>&1 | tail -40 || true
          docker logs --tail=100 pbs-plus-test 2>&1
          return 1
        }

        verify_mailbox() {
          local user=$1
          docker exec pbs-plus-dovecot-destination grep -R -F 'source-message' "/srv/mail/$user" >/dev/null || {
            echo "$user is missing the restored source message"
            docker exec pbs-plus-dovecot-destination find "/srv/mail/$user" -maxdepth 3 -type f 2>/dev/null || true
            return 1
          }
          echo "$user has the restored source message"
        }

        snapshot=$(latest_snapshot)
        echo "Restoring from snapshot $snapshot"

        create_restore \
          --data-urlencode 'id=e2e-dovecot-restore' \
          --data-urlencode 'store=test' \
          --data-urlencode 'ns=dovecot-e2e' \
          --data-urlencode "snapshot=$snapshot" \
          --data-urlencode 'src-path=/' \
          --data-urlencode 'dest-target=e2e-dovecot-destination' \
          --data-urlencode 'dest-subpath=' \
          --data-urlencode 'dovecot_source_username=alice@example.com' \
          --data-urlencode 'dovecot_destination_username=bob@example.com' \
          --data-urlencode 'dovecot_mailbox=' \
          --data-urlencode 'replace_existing=false' \
          --data-urlencode 'comment=' \
          --data-urlencode 'pre_script=' \
          --data-urlencode 'post_script='
        start_restore 'e2e-dovecot-restore'
        wait_for_restore 'e2e-dovecot-restore'

        docker exec pbs-plus-dovecot-destination grep -R -F 'source-message' /srv/mail/bob@example.com >/dev/null
        docker exec pbs-plus-dovecot-destination grep -R -F 'destination-message' /srv/mail/bob@example.com >/dev/null
        echo "Additive restore kept bob's existing message and delivered alice's message"

        create_restore \
          --data-urlencode 'id=e2e-dovecot-replace' \
          --data-urlencode 'store=test' \
          --data-urlencode 'ns=dovecot-e2e' \
          --data-urlencode "snapshot=$snapshot" \
          --data-urlencode 'src-path=/' \
          --data-urlencode 'dest-target=e2e-dovecot-destination' \
          --data-urlencode 'dest-subpath=' \
          --data-urlencode 'dovecot_source_username=alice@example.com' \
          --data-urlencode 'dovecot_destination_username=carol@example.com' \
          --data-urlencode 'dovecot_mailbox=' \
          --data-urlencode 'replace_existing=true' \
          --data-urlencode 'comment=' \
          --data-urlencode 'pre_script=' \
          --data-urlencode 'post_script='
        start_restore 'e2e-dovecot-replace'
        wait_for_restore 'e2e-dovecot-replace'

        verify_mailbox carol@example.com
