name: Show Logs
description: Display endpoint responses and container logs

runs:
  using: composite
  steps:
    - name: Show response contents
      shell: bash
      run: |
        for port in 8007 8017; do
          echo
          echo "==================================="
          echo "Port ${port} Response:"
          echo "==================================="
          cat "port_${port}.log" 2>/dev/null || echo "no log file found"
        done

    - name: Show container logs
      shell: bash
      run: |
        for container in pbs-plus-test pbs-plus-agent; do
          echo
          echo "==================================="
          echo "${container} logs:"
          echo "==================================="
          if [ -n "$(docker ps -aq -f "name=^${container}$")" ]; then
            docker logs "${container}" 2>&1 || echo "could not read logs for ${container}"
          else
            echo "${container} was not started by this suite"
          fi
        done
