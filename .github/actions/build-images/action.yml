name: Build Docker Images
description: Build PBS Plus server and agent images

runs:
  using: composite
  steps:
    - name: Build test PBS Plus server
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./build/tests/Dockerfile
        tags: pbs-plus:test
        load: true
        cache-from: type=gha,scope=pbs-plus-server
        cache-to: type=gha,mode=max,scope=pbs-plus-server

    - name: Build containerized agent
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        tags: pbs-plus-agent:test
        load: true
        cache-from: type=gha,scope=pbs-plus-agent
        cache-to: type=gha,mode=max,scope=pbs-plus-agent

    - name: Make test datastore
      shell: bash
      run: mkdir test
