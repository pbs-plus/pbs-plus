name: Tests

on:
  workflow_call:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: write

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    name: E2E tests
    uses: ./.github/workflows/e2e-tests.yml
    with:
      go-version: "1.27"

  go-tests:
    name: Go tests
    uses: ./.github/workflows/go-tests.yml
    with:
      go-version: "1.27"
