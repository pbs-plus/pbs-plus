name: Publish plugins repository

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Build target plugin binaries
        run: |
          mkdir -p dist-bins/plugins
          for plugin in filesystem agentfs s3 postgresql mysql ldap dovecot; do
            CGO_ENABLED=0 GOEXPERIMENT=greenteagc GOFIPS140=latest \
              go build \
              -trimpath \
              -ldflags "-s -w" \
              -o "dist-bins/plugins/pbs-plus-plugin-$plugin" \
              "./cmd/plugin-$plugin"
          done

      - name: Sign and publish repository tree
        env:
          PLUGIN_PUBLISHER_KEY: ${{ secrets.PLUGIN_PUBLISHER_KEY }}
          PLUGINS_REPO_TOKEN: ${{ secrets.PLUGINS_REPO_TOKEN }}
        run: |
          echo "$PLUGIN_PUBLISHER_KEY" > /tmp/plugin-publisher-key.pem
          go run ./cmd/plugin-publish \
            -key /tmp/plugin-publisher-key.pem \
            -id org.pbs-plus.plugins \
            -publisher "PBS Plus" \
            -out /tmp/plugins-repo-tree \
            dist-bins/plugins/pbs-plus-plugin-*
          cd /tmp/plugins-repo-tree
          git init -q -b main
          git config user.name "pbs-plus-ci"
          git config user.email "ci@pbs-plus.org"
          git add -A
          git commit -qm "publish first-party plugins"
          git push -q --force-with-lease=false "https://x-access-token:${PLUGINS_REPO_TOKEN}@github.com/pbs-plus/plugins.git" main

      - name: Verify published repository
        run: |
          sleep 5
          go run ./cmd/plugin-verify-repo \
            "https://raw.githubusercontent.com/pbs-plus/plugins/main/index.toml" \
            "${{ secrets.PLUGIN_PUBLISHER_KEY }}"
