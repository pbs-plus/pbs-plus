name: E2E tests workflow

on:
  workflow_call:
    inputs:
      go-version:
        required: true
        type: string
      timeout-seconds:
        required: false
        type: number
        default: 60

jobs:
  e2e-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-test-env
        with:
          go-version: ${{ inputs.go-version }}

      - name: Build images
        uses: ./.github/actions/build-images

      - name: Setup PBS Plus server
        uses: ./.github/actions/setup-pbs-server
        with:
          timeout-seconds: ${{ inputs.timeout-seconds }}

      - name: Test HTTPS endpoints
        uses: ./.github/actions/test-endpoints

      - name: Initialize PBS Plus
        uses: ./.github/actions/init-pbs
        id: init-pbs

      - name: Run database backup tests
        uses: ./.github/actions/run-database-backups
        with:
          timeout-seconds: 300

      - name: Run LDAP backup tests
        uses: ./.github/actions/run-ldap-backups
        with:
          timeout-seconds: 300

      - name: Run Dovecot mailbox tests
        uses: ./.github/actions/run-dovecot-backups
        with:
          timeout-seconds: 300

      - name: Setup and run agent
        uses: ./.github/actions/setup-agent
        with:
          plus-token: ${{ steps.init-pbs.outputs.plus-token }}
          ca-fingerprint: ${{ steps.init-pbs.outputs.ca-fingerprint }}
          timeout-seconds: ${{ inputs.timeout-seconds }}

      - name: Run backup test
        uses: ./.github/actions/run-backup
        with:
          timeout-seconds: ${{ inputs.timeout-seconds }}

      - name: Verify backup task log
        uses: ./.github/actions/verify-task-log
        with:
          endpoint: json/d2d/backup
          job-id: test-backup-job
          append-job-id: false
          worker-type: backup

      - name: Run concurrent backup correlation test
        uses: ./.github/actions/run-concurrent-backups
        with:
          timeout-seconds: 240

      - name: Run notification batch test
        uses: ./.github/actions/run-notification-batch
        with:
          timeout-seconds: 240

      - name: Run restore test
        uses: ./.github/actions/run-restore
        with:
          timeout-seconds: ${{ inputs.timeout-seconds }}

      - name: Verify restore task log
        uses: ./.github/actions/verify-task-log
        with:
          endpoint: extjs/config/disk-restore
          job-id: test-restore
          worker-type: reader
          allow-warnings: true

      - name: Run verification test
        uses: ./.github/actions/run-verification
        with:
          timeout-seconds: 120

      - name: Verify verification task log
        uses: ./.github/actions/verify-task-log
        with:
          endpoint: extjs/config/d2d-verification
          job-id: test-verify-basic
          worker-type: verification

      - name: Run pxar-mount e2e tests
        uses: ./.github/actions/run-pxar-e2e
        with:
          timeout-seconds: 300

      - name: Run mount API e2e tests
        uses: ./.github/actions/run-mount-e2e
        with:
          timeout-seconds: 900

      - name: Run NFS outpost e2e tests
        uses: ./.github/actions/run-outpost-e2e
        with:
          timeout-seconds: 600

      - name: Run VFS outpost e2e tests
        uses: ./.github/actions/run-vfs-outpost-e2e
        with:
          timeout-seconds: 900

      - name: Run archive expansion e2e tests
        uses: ./.github/actions/run-archive-expand-e2e
        with:
          timeout-seconds: 900

      - name: Show logs
        if: always()
        uses: ./.github/actions/show-logs

      - name: Cleanup
        if: always()
        uses: ./.github/actions/cleanup
