version: "2"
sql:
  - engine: "sqlite"
    queries: "internal/server/coredb/queries"
    schema: "internal/server/coredb/migrations"
    gen:
      go:
        package: "corequery"
        out: "internal/server/coredb/corequery"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        emit_pointers_for_null_types: false
  - engine: "sqlite"
    queries: "internal/server/jobs/jobdb/queries"
    schema: "internal/server/jobs/jobdb/migrations"
    gen:
      go:
        package: "jobquery"
        out: "internal/server/jobs/jobdb/jobquery"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        emit_pointers_for_null_types: false
  - engine: "sqlite"
    queries: "internal/server/mtf/mtfdb/queries"
    schema: "internal/server/mtf/mtfdb/migrations"
    gen:
      go:
        package: "mtfquery"
        out: "internal/server/mtf/mtfdb/mtfquery"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        emit_pointers_for_null_types: false
